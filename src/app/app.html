<main class="d-flex flex-column justify-content-center align-items-center border rounded p-4 shadow-sm mx-3 my-4">
  <div class="d-flex flex-row align-items-center gap-4">
      <h1 class="text-center my-4 flex-grow-1">
      Bienvenue sur la plateforme de formations en ligne
    </h1>
    <app-user-icon class="flex-1" [isConnected]="isConnected" [isAdmin]="isAdmin"></app-user-icon>
  </div>
  <div class="d-flex gap-2 align-items-center justify-content-center mb-4">
      <button class="btn btn-secondary shadow" routerLink="/trainings" >Formations</button>
      <button class="btn btn-secondary shadow d-flex align-items-center gap-2 cart" routerLink="/cart" ><img src="assets/icon-shopping-cart.png" alt="Cart Icon" class="icon-cart" style="width: 50px; height: auto; cursor: pointer;"  />Panier<span class="badge bg-danger text-white">{{cartService.cartItemCount()}}</span></button>
      <button class="btn btn-secondary shadow" routerLink="/form" >Formulaire d'envoi</button>
  </div>
  @if (!isConnected) {
    <p class="text-center mb-4">Veuillez vous connecter pour accéder à toutes les fonctionnalités.</p>
  } @else {
    <div class="w-100 d-flex justify-content-center">
    <router-outlet></router-outlet>
  </div>
  }
  <app-connection (isConnected)="onConnectionSuccess($event)" (dropDownVisible)="onDropDownToggle($event)" (isAdmin)="onAdminStatusChange($event)"></app-connection>
  <app-manage-trainings></app-manage-trainings>
</main>
