<main class="d-flex flex-column align-items-center border rounded p-4 shadow-sm mx-3 my-4">
  <h1 class="text-center my-4">
    Bienvenue sur la plateforme de formations en ligne
  </h1>
  <div class="d-flex gap-2 align-items-center justify-content-center mb-4">
      <button class="btn btn-secondary shadow" routerLink="/trainings" >Formations</button>
      <button class="btn btn-secondary shadow" routerLink="/cart" >Panier</button>
      <button class="btn btn-secondary shadow" routerLink="/form" >Formulaire d'envoi</button>
      @if (currentRoute === '/trainings') {
        <app-searchbar></app-searchbar>
      }
  </div>
  <div class="w-100 d-flex justify-content-center">
    <router-outlet></router-outlet>
  </div>
  
</main>
