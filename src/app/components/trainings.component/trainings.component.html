
<ng-container>
    <table class="table table-striped table-hover shadow rounded p-3 mb-5 bg-white border" style="width: 1000px;">
        <thead>
            <tr>
                <th>ID</th><th>NOM</th><th>DESCRIPTION</th><th>PRIX</th><th>QUANTITÉ</th><th>ACTION</th>
            </tr>
        </thead>
        <tbody>
        @for (training of listTrainings; track training.id) {
            <tr>
                <td>{{training.id}}</td>
                <td>{{training.name}}</td>
                <td>{{training.description}}</td>
                <td>{{training.price}}</td>
                <td><input type="number" name="quantity" style="width: 60px" [(ngModel)]="training.quantity"/></td>
                <td><a class="btn btn-primary" (click)="onAddToCart(training)">Add to Cart</a></td>
            </tr>
        }
        </tbody>
    </table>
</ng-container>
