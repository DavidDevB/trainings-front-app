
<div>
    <div class="d-flex justify-content-center mb-3">
        <app-searchbar (searchChange)="onSearchChange($event)"></app-searchbar>
        <app-max-price (priceChange)="onMaxPriceChange($event)"></app-max-price>
    </div>
    <table class="table table-striped table-hover shadow mb-5 bg-white border" style="width: 1000px;">
        <thead >
            <tr >
                <th>ID</th><th>NOM</th><th style="cursor: pointer;"(click)="orderByCategory()">CATEGORIE</th><th>DESCRIPTION</th><th>PRIX</th><th>QUANTITÉ</th><th>ACTION</th>
            </tr>
        </thead>
        <tbody>
        @for (training of listTrainings; track training.id) {
            <tr>
                <td class="{{theme}}-theme">{{training.id}}</td>
                <td class="{{theme}}-theme">{{training.name}}</td>
                <td class="{{theme}}-theme">{{training.category}}</td>
                <td class="{{theme}}-theme">{{training.description}}</td>
                <td class="{{theme}}-theme">{{training.price}}</td>
                <td class="{{theme}}-theme"><input type="number" name="quantity" style="width: 60px" [(ngModel)]="training.quantity"/></td>
                <td class="{{theme}}-theme"><a class="add-button" matButton="filled" (click)="onAddToCart(training)" ()>Ajouter au panier</a></td>
            </tr>
        }
        </tbody>
    </table>
</div>
