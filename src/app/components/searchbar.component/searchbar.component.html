

<ng-container >
  <div class="search-bar d-flex justify-content-center mb-3">
    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchInput($event)"
    />
    <button class="btn btn-secondary shadow" (click)="clearSearch()">Clear</button>
  </div>
</ng-container>
