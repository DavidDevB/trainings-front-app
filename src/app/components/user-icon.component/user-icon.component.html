
<div class="dropdown">
<button class="btn btn-link p-0 border-0" type="button" id="dropdownMenuButton" aria-haspopup="true" aria-expanded="false" (click)="toggleDropDown()" style="cursor: pointer;">
    <img src="/assets/icon-user.png" alt="User Icon" class="icon-user" style="width: 50px; height: 50px;">
</button>
@if (dropDownVisible && isConnected) {
<div class="dropdown-menu show">
  @if (isAdmin) {
    <a class="dropdown-item" (click)="manageModal()" style="cursor: pointer;">Gérer</a>
  }
    <div class="dropdown-divider"></div>
    <a class="dropdown-item" (click)="openOrders()" style="cursor: pointer;">Commandes</a>
    <div class="dropdown-divider"></div>
    <a class="dropdown-item" (click)="logout()" href="">Déconnexion</a>
    <div class="dropdown-divider"></div>
      <a class="dropdown-item" (click)="toggleDropDown()" style="cursor: pointer;">
        Fermer
      </a>
  </div>
}
@else if (dropDownVisible && !isConnected) {
<div class="dropdown-menu show">
        <a class="dropdown-item" (click)="openModal()" style="cursor: pointer;">Se connecter</a>
        <div class="dropdown-divider"></div>
      <a class="dropdown-item" (click)="toggleDropDown()" style="cursor: pointer;">
        Fermer
      </a>
    </div>
}
</div>
